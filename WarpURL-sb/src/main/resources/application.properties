spring.application.name=warpurl-sb

# ---------------- Database Configuration (Dynamic with Fallbacks) ----------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/url_shortener_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# ---------------- Security & JWT (Dynamic with Fallbacks) ----------------
jwt.secret=${JWT_SECRET:9c0af5190e30dd3ea0466e42e6482505747cda54f668ce9a1f803af960e17617}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------------- CORS / Frontend Integration ----------------
frontend.url=${FRONTEND_URL:http://localhost:5173}
